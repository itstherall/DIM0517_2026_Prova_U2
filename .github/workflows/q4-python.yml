name: Python

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py
  
  testes_uni:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  imagem:
    needs: testes_uni
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Construir a imagem
        run: docker build -t hello:ci .

      - name: Subir o contêiner
        run: docker run -d --name hllw -p 5000:5000 hello:ci

      - name: Esperar a API
        run: |
          for i in $(seq 1 15); do
          curl -fs http://localhost:5000/hello && exit 0
          sleep 2
          done
          exit 1- name: Testar HelloW
        
        
      - name: Logs do contêiner
        if: failure()
        run: docker logs cal